[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms"
version = "4.0.0"
description = "Tiny millisecond conversion utility (Python port of vercel/ms)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vercel, Inc." }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
